name: Homecoming remaining branches and lifecycle
on:
  push:
    branches: [feature/companion-homecoming]
    paths:
      - 'scripts/browser/homecoming-remaining-acceptance.mjs'
      - '.github/workflows/homecoming-remaining-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  remaining:
    if: github.ref == 'refs/heads/feature/companion-homecoming'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk xvfb
      - name: Test all story choices and native tab lifecycle with real Worker
        run: xvfb-run -a node scripts/browser/homecoming-remaining-acceptance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homecoming-remaining-browser
          path: browser-qa/homecoming-remaining/
          retention-days: 14
