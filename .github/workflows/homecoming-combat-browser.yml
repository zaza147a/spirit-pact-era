name: Homecoming natural browser combat
on:
  push:
    branches: [feature/companion-homecoming]
    paths:
      - 'scripts/browser/homecoming-combat-acceptance.mjs'
      - '.github/workflows/homecoming-combat-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: homecoming-natural-combat-${{ github.ref }}
  cancel-in-progress: true
jobs:
  combat:
    if: github.ref == 'refs/heads/feature/companion-homecoming'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser runtime
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium and CJK fonts
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Eight natural story fights and two defeat controls
        run: node scripts/browser/homecoming-combat-acceptance.mjs
      - name: Preserve battle report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homecoming-natural-browser-combat
          path: browser-qa/homecoming-combat/
          retention-days: 14
