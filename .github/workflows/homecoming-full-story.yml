name: Homecoming twelve complete browser stories
on:
  push:
    branches: [feature/companion-homecoming]
    paths:
      - 'scripts/browser/homecoming-full-story.mjs'
      - '.github/workflows/homecoming-full-story.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: homecoming-full-story-${{ github.ref }}
  cancel-in-progress: true
jobs:
  story:
    if: github.ref == 'refs/heads/feature/companion-homecoming'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Complete twelve stories with real choices, fights and cumulative rewards
        run: node scripts/browser/homecoming-full-story.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homecoming-twelve-complete-stories
          path: browser-qa/homecoming-full-story/
          retention-days: 14
