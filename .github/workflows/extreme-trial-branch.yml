name: Extreme trial card search - test branch only
on:
  push:
    branches: [test/12-jobs-optimal-loadout-20261110]
    paths: ['.github/workflows/extreme-trial-branch.yml']
permissions:
  contents: write
concurrency:
  group: extreme-trial-card-search
  cancel-in-progress: false
jobs:
  priest:
    if: github.ref == 'refs/heads/test/12-jobs-optimal-loadout-20261110'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/12-jobs-optimal-loadout-20261110
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run and commit each real trial mode
        shell: bash
        env:
          EXTREME_JOB: priest
          EXTREME_CARD_CONCURRENCY: '4'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for mode in matk; do
            export EXTREME_MODES="$mode"
            node scripts/current-extreme-card-refinement.mjs
            node --test tests/current-extreme-results-integrity.test.mjs
            node scripts/current-extreme-handoff-stage.mjs "$EXTREME_JOB" "$mode"
            git add docs/handoff-12-jobs-loadout-2026-11-10.md
            git add docs/current-extreme-card-"$EXTREME_JOB"-"$mode"-*-20261111.json
            git commit -m "test: complete $EXTREME_JOB $mode boss-card trial and handoff [skip ci]"
            git push origin HEAD:test/12-jobs-optimal-loadout-20261110
          done
      - name: Upload trial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: priest-extreme-card-results
          path: docs/current-extreme-card-priest-*-20261111.json
          if-no-files-found: warn
