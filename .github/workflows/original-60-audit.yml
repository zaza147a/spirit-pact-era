name: Original 60 fusion mechanic gap audit
on:
  push:
    branches: [feature/humanoid-pet-evolution]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/audit-original-60-events.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: original-60-gap-audit
          path: docs/original-60-trigger-audit.json
