name: Spirit Tamer regression (test branch only)

on:
  push:
    branches:
      - feature/spirit-tamer-dual-pets
    paths:
      - 'dist/**'
      - '!dist/assets/cosmetics/**'
      - '!dist/cosmetic-gallery.js'
      - '!dist/cosmetic-gallery.css'
      - 'tests/**'
      - '!tests/cosmetic-gallery.test.mjs'
      - '.github/workflows/spirit-tamer-regression.yml'
  workflow_dispatch:

# Cancel superseded automatic runs on this test branch.
# Manual full-acceptance runs have a separate group and are never auto-cancelled.
concurrency:
  group: spirit-tamer-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  boss-card-focused:
    if: ${{ contains(github.event.head_commit.message, '[card-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate boss-card data, sockets and salvage
        run: |
          node tests/boss-card-salvage-regression.mjs
          node tests/boss-card-runtime.test.mjs
      - name: Validate card effects and card recycling
        run: |
          node tests/card-balance-v404.test.mjs
          node tests/card-recycling.test.mjs
      - name: Validate card collection and runtime syntax
        run: |
          node tests/card-collection.test.mjs
          node --check dist/game.js

  regression:
    if: ${{ !contains(github.event.head_commit.message, '[card-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Short real offline combat simulation
        run: node tests/offline-worker-combat-smoke.mjs
      - name: Run dual-pet combat regression
        run: node tests/dual-pet-combat-regression.mjs
      - name: Verify commander-only multiple targets for attacks and skills
        run: node tests/spirit-commander-cleave-regression.mjs
      - name: Verify commander pets progressively inherit owner combat strength
        run: node tests/spirit-commander-owner-growth.test.mjs
      - name: Verify low-to-mythic-to-SSS spirit cultivation stages
        run: node tests/spirit-cultivation-stages.test.mjs
      - name: Verify contract sigil scales assimilated stats and leaves legacy jobs unchanged
        run: node tests/spirit-sigil-assimilation-regression.mjs
      - name: Verify boss and 201-plus field role multipliers exclude legacy jobs
        run: node tests/spirit-role-specialization-regression.mjs
      - name: Run resonance condition positive and negative cases
        run: node tests/dual-pet-resonance-signature.test.mjs
      - name: Smoke four synthetic 200/210 fused spirit worker states
        run: node tests/spirit-high-level-fixture.test.mjs
      - name: Real Worker combat for all 42 fused third-job resonances
        run: node tests/spirit-42-live-resonance.test.mjs
      - name: Verify both spirit damage-taking roles in twelve real Worker battles
        run: node tests/spirit-role-aggro-live-observation.mjs
      - name: Run dual-pet module regression suite
        shell: bash
        run: |
          set -euo pipefail
          for testfile in tests/{dual-fusion-resonance,dual-pet-effects,dual-pet-formation,dual-pet-scheduler,dual-pet-targeting,spirit-equipment-drop,spirit-job-rules}.test.mjs; do
            node "$testfile"
          done

  benchmark-starter:
    if: ${{ !contains(github.event.head_commit.message, '[card-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Real offline 6-minute deterministic baseline
        env:
          SPIRIT_BENCH_HOURS: '0.1'
          SPIRIT_BENCH_REPEAT: '1'
          SPIRIT_BENCH_TIMEOUT_MS: '120000'
        run: node tests/offline-worker-benchmark.mjs --starter
      - name: Full 6-minute offline salvage loop (no early termination)
        env:
          SPIRIT_BENCH_HOURS: '0.1'
          SPIRIT_BENCH_REPEAT: '1'
          SPIRIT_BENCH_TIMEOUT_MS: '120000'
        run: node tests/offline-worker-benchmark.mjs --starter-salvage
      - name: Real dual-pet offline 6-minute full simulation
        env:
          SPIRIT_BENCH_HOURS: '0.1'
          SPIRIT_BENCH_REPEAT: '1'
          SPIRIT_BENCH_TIMEOUT_MS: '120000'
        run: node tests/offline-worker-benchmark.mjs --starter-dual-salvage

  balance-observation:
    if: ${{ !contains(github.event.head_commit.message, '[card-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Observe 84 real 200/210 spirit combat scenarios
        run: node tests/spirit-live-balance-observation.mjs

  high-level-offline-observation:
    if: ${{ !contains(github.event.head_commit.message, '[card-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bounded level-200 and 210 dual-fusion five-minute smoke workers
        env:
          SPIRIT_HIGH_LEVEL_BENCH_MINUTES: '5'
        run: node tests/spirit-high-level-offline-benchmark.mjs

  petstat-cache-equivalence:
    if: ${{ !contains(github.event.head_commit.message, '[card-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cached versus uncached 200/210 dual-pet ten-minute full state parity
        run: node tests/spirit-offline-petstat-cache-equivalence.mjs

  spirit-skill-priority-observation:
    if: ${{ !contains(github.event.head_commit.message, '[card-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare three auto skill priorities in 36 real worker fights
        run: node tests/spirit-skill-priority-observation.mjs


  all-fusion-priority-observation:
    if: ${{ !contains(github.event.head_commit.message, '[card-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare all 42 resonance routes under two skill orders and RNG seeds
        run: node tests/spirit-42-priority-comparison.mjs


  warrior-assimilation-observation:
    if: ${{ !contains(github.event.head_commit.message, '[card-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit Pact Warrior assist and assimilation owner damage
        run: node tests/spirit-warrior-assimilation-baseline.mjs


  spirit-role-42-matrix:
    if: ${{ !contains(github.event.head_commit.message, '[card-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare 252 owner-led and pet-led 200/210 real combat cases
        run: node tests/spirit-role-42-combat-matrix.mjs


  legacy-survival-control:
    if: ${{ !contains(github.event.head_commit.message, '[card-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare all twelve jobs in 1h same-map survival controls
        run: node tests/spirit-legacy-survival-control.mjs

  spirit-survival-sweep:
    if: ${{ !contains(github.event.head_commit.message, '[card-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare 5m and 10m sustained survival for both spirit roles
        run: node tests/spirit-survival-sweep.mjs

  spirit-specialization-matrix:
    if: ${{ !contains(github.event.head_commit.message, '[card-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare both spirit roles across all 15 legal pairs in boss-chain and field combat
        run: node tests/spirit-specialization-matrix.mjs

  spirit-twelve-job-five-minute-ranking:
    if: ${{ !contains(github.event.head_commit.message, '[card-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rank actual five-minute kills across ten legacy jobs and two spirit roles
        run: node tests/spirit-twelve-job-five-minute-ranking.mjs

  spirit-twelve-job-five-boss-ranking:
    if: ${{ !contains(github.event.head_commit.message, '[card-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rank 200 five-boss clears against ten existing jobs with SS gear
        run: node tests/spirit-twelve-job-five-boss-ranking.mjs

  spirit-twelve-job-sss-sigil8-five-boss-ranking:
    if: ${{ !contains(github.event.head_commit.message, '[card-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare all twelve jobs in five-boss trials with full mythic SSS and sigil 8
        run: node tests/spirit-twelve-job-sss-sigil8-five-boss-ranking.mjs

  spirit-cultivation-field-audit:
    if: ${{ !contains(github.event.head_commit.message, '[card-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify twelve-class low, mythic and SSS cultivation field DPS
        run: node tests/spirit-cultivation-field-audit.mjs

  spirit-210-max-sigil-ranking:
    if: ${{ !contains(github.event.head_commit.message, '[card-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare all twelve jobs at level 210 and sigil 0 versus 8
        run: node tests/spirit-210-max-sigil-ranking.mjs

  spirit-201-mixed-build-search:
    if: ${{ !contains(github.event.head_commit.message, '[card-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Search twelve jobs across legal fused pets and legal stat and priority choices in mixed boss field
        run: node tests/spirit-201-mixed-build-search.mjs

  spirit-201-optimized-archetype-search:
    if: ${{ !contains(github.event.head_commit.message, '[card-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Search legal max-sigil gear card stats weapons fusion and compare 12 jobs
        run: node tests/spirit-201-optimized-archetype-search.mjs

  normal-card-uplift-audit:
    if: ${{ !contains(github.event.head_commit.message, '[card-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare no cards and ten normal cards for all twelve jobs in live 201 map Worker
        run: node tests/spirit-normal-card-uplift-audit.mjs
