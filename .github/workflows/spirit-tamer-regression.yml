name: Spirit Tamer regression (test branch only)

on:
  push:
    branches:
      - feature/spirit-tamer-dual-pets
    paths:
      - 'dist/**'
      - 'tests/**'
      - '.github/workflows/spirit-tamer-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Smoke test real offline Node Worker
        run: node tests/offline-worker-smoke.mjs
      - name: Short real offline combat simulation
        run: node tests/offline-worker-combat-smoke.mjs
      - name: Run offline optimizer regression
        run: node tests/offline-optimizer-regression.mjs
      - name: Run dual-pet combat regression
        run: node tests/dual-pet-combat-regression.mjs
      - name: Run resonance condition positive and negative cases
        run: node tests/dual-pet-resonance-signature.test.mjs
      - name: Run dual-pet UI regression
        run: node tests/spirit-dual-ui-regression.mjs
      - name: Smoke four synthetic 200/210 fused spirit worker states
        run: node tests/spirit-high-level-fixture.test.mjs
      - name: Real Worker combat for all 42 fused third-job resonances
        run: node tests/spirit-42-live-resonance.test.mjs
      - name: Verify both spirit damage-taking roles in twelve real Worker battles
        run: node tests/spirit-role-aggro-live-observation.mjs
      - name: Run dual-pet module regression suite
        shell: bash
        run: |
          set -euo pipefail
          for testfile in tests/{dual-fusion-resonance,dual-pet-effects,dual-pet-formation,dual-pet-scheduler,dual-pet-targeting,spirit-equipment-drop,spirit-job-rules}.test.mjs; do
            node "$testfile"
          done

  benchmark-starter:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Real offline 1/6/12/24-hour deterministic baseline
        env:
          SPIRIT_BENCH_HOURS: '1,6,12,24'
          SPIRIT_BENCH_REPEAT: '2'
          SPIRIT_BENCH_TIMEOUT_MS: '120000'
        run: node tests/offline-worker-benchmark.mjs --starter
      - name: Full 1/6/12/24-hour offline salvage loop (no early termination)
        env:
          SPIRIT_BENCH_HOURS: '1,6,12,24'
          SPIRIT_BENCH_REPEAT: '2'
          SPIRIT_BENCH_TIMEOUT_MS: '120000'
        run: node tests/offline-worker-benchmark.mjs --starter-salvage
      - name: Real dual-pet offline 1/6/12/24-hour full simulation
        env:
          SPIRIT_BENCH_HOURS: '1,6,12,24'
          SPIRIT_BENCH_REPEAT: '2'
          SPIRIT_BENCH_TIMEOUT_MS: '120000'
        run: node tests/offline-worker-benchmark.mjs --starter-dual-salvage

  balance-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Observe 84 real 200/210 spirit combat scenarios
        run: node tests/spirit-live-balance-observation.mjs

  gear-quality-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare actual 200/210 combat across normal legendary mythic gear
        run: node tests/spirit-gear-quality-observation.mjs

  rare-resonance-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Five low-frequency dual resonances at 200/210 for 5m and two seeds
        run: node tests/spirit-rare-resonance-observation.mjs

  high-level-offline-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bounded level-200 and 210 dual-fusion five-minute smoke workers
        env:
          SPIRIT_HIGH_LEVEL_BENCH_MINUTES: '5'
        run: node tests/spirit-high-level-offline-benchmark.mjs

  petstat-cache-equivalence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cached versus uncached 200/210 dual-pet ten-minute full state parity
        run: node tests/spirit-offline-petstat-cache-equivalence.mjs

  survival-economy-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare twelve 200/210 defensive and offensive fusion farm scenarios
        run: node tests/spirit-offline-survival-economy-observation.mjs

  twelve-profession-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare twelve 200/210 professions through real offline combat
        run: node tests/spirit-vs-ten-jobs-combat-observation.mjs


  spirit-skill-priority-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare three auto skill priorities in 36 real worker fights
        run: node tests/spirit-skill-priority-observation.mjs


  all-fusion-priority-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare all 42 resonance routes under two skill orders and RNG seeds
        run: node tests/spirit-42-priority-comparison.mjs


  warrior-assimilation-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit Pact Warrior assist and assimilation owner damage
        run: node tests/spirit-warrior-assimilation-baseline.mjs


  spirit-role-42-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare 252 owner-led and pet-led 200/210 real combat cases
        run: node tests/spirit-role-42-combat-matrix.mjs


  legacy-survival-control:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare all twelve jobs in 1h same-map survival controls
        run: node tests/spirit-legacy-survival-control.mjs

  spirit-survival-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare 1h and 6h sustained survival for both spirit roles
        run: node tests/spirit-survival-sweep.mjs

  role-correct-24h-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Observe full 24-hour real Worker survival, gold, pet states in four legal roles
        run: node tests/spirit-role-24h-worker.mjs

  spirit-underlevel-map-survival:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare Lv170/180 gear in 191-200 and strictly SSS in 201-210
        run: node tests/spirit-underlevel-map-survival.mjs

  spirit-low-gear-five-boss:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test 48 Lv200 five-boss attempts with Lv170/180 mythic gear, none/S/SS
        run: node tests/spirit-200-low-gear-five-boss.mjs

  spirit-200-five-boss-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 'Actual five-boss Worker fight at 200: mythic unenhanced versus SS'
        run: node tests/spirit-200-five-boss-live-observation.mjs
