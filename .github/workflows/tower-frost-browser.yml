name: Tower frost desktop acceptance
on:
  push:
    branches: [feature/endless-tower-1-30]
    paths:
      - '.github/workflows/tower-frost-browser.yml'
      - 'scripts/browser/tower-frost-acceptance.mjs'
      - 'dist/game.js'
      - 'dist/index.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frost-desktop:
    if: github.ref == 'refs/heads/feature/endless-tower-1-30'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify tower and wardrobe logic
        run: node --test tests/tower-costumes.test.mjs tests/tower-costumes-game-integration.test.mjs tests/tower-art-assets.test.mjs
      - name: Install browser just for desktop acceptance
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify twelve lobby portraits and save/reload
        run: node scripts/browser/tower-frost-acceptance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tower-frost-desktop-evidence
          path: browser-qa/tower-frost/
          retention-days: 14
