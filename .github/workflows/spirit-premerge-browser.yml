name: Spirit pre-MAIN browser acceptance
on:
  push:
    branches: [review/spirit-main-premerge-20261106]
    paths:
      - 'scripts/browser/spirit-premerge-acceptance.mjs'
      - '.github/workflows/spirit-premerge-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser runtime
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test real creator, entering game, slots, reload
        run: node scripts/browser/spirit-premerge-acceptance.mjs
