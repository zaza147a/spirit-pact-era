name: Spirit Tamer heavy offline benchmark (manual test branch only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  high-level-1-6-12-24h:
    # Never checkout main; only execute the dedicated experiment branch.
    if: github.ref == 'refs/heads/feature/spirit-tamer-dual-pets'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/spirit-tamer-dual-pets
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full 16-scenario level-200 and 210 dual-fusion 1/6/12/24h observation
        run: node tests/spirit-high-level-offline-benchmark.mjs

      - name: Four role-correct 24h owner-led and pet-led benchmark cases
        run: node tests/spirit-role-24h-worker.mjs
