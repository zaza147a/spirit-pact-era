          ref: test/12-jobs-optimal-loadout-20261110
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Screen seven legal attribute profiles against physical and magical endurance
        env:
          EXTREME_JOB: knight
          EXTREME_MODES: atk,matk
        run: |
          set -euo pipefail
          node scripts/current-extreme-oldjobs-attribute-screen.mjs
          git fetch origin test/12-jobs-optimal-loadout-20261110
          git reset --soft origin/test/12-jobs-optimal-loadout-20261110
          git restore --source=origin/test/12-jobs-optimal-loadout-20261110 --staged --worktree .github/workflows scripts
          cat >> docs/handoff-12-jobs-loadout-2026-11-10.md <<'EOF'

          ## 分段交接：knight ATK/MATK 配點實戰

          - 各七種合法配點、固定 seeded-v3 各模式基準武器/融合寵/王卡；14 場實戰。
          - 結果 `docs/current-extreme-seeded-v3-attribute-knight-atk-matk-summary-20261111.json`，有限搜尋非全域最優；main 未變更。
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          git commit -m "test: save knight physical and magical endurance attribute trials [skip ci]"
