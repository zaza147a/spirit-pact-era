name: Isolated Weapon Fusion and Revival Validation
on:
  push:
    branches: [experiment-weapon-balance-20261102]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check main game module syntax
        run: |
          node --check dist/game.js
          node --check dist/pet-fusion.js
          node --check dist/pet-effects.js
          node --check dist/pet-abilities.js
      - name: Validate weapon, six unordered fusion routes, sixty resonances and revival
        run: |
          node --test --test-concurrency=2 tests/*.test.mjs
      - name: Generate 120-scenario diagnostic allocation output
        run: |
          mkdir -p test-results
          node tests/lv200-lv210-optimization-diagnostic.mjs > test-results/lv200-lv210-120-weapon-stat-diagnostic.json
          node -e "const d=require('./test-results/lv200-lv210-120-weapon-stat-diagnostic.json');if(d.rows.length!==120)throw Error('Expected 120 diagnostic rows');console.log('Diagnostic scenarios:',d.rows.length)"
      - name: Generate real-map six-fusion pet direct-hit diagnostics
        run: |
          mkdir -p test-results
          node tests/lv200-lv210-pet-output-diagnostic.mjs > test-results/lv200-lv210-120-pet-throughput-proxy.json
          node -e "const d=require('./test-results/lv200-lv210-120-pet-throughput-proxy.json');if(d.rows.length!==120)throw Error('Expected 120 pet rows');if(new Set(d.rows.filter(x=>x.level===200 && x.job==='assassin').map(x=>x.bossDpsProxy)).size<2)throw Error('Fusion outputs unexpectedly identical');console.log('Pet benchmark scenarios:',d.rows.length)"
      - name: Upload diagnostic results (not certified actual DPS)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lv200-lv210-120-weapon-proxy
          path: test-results/*.json
          if-no-files-found: ignore
  real-combat-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Chromium browser harness
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Execute actual combatTick and hit attribution
        run: node tests/real-combat-browser-benchmark.mjs smoke
      - name: Persist verified smoke results to isolated branch only
        run: |
          test -s test-results/lv200-lv210-smoke-actual-combat.json
          mkdir -p docs/test-results
          node --input-type=module -e "import fs from 'node:fs'; const d=JSON.parse(fs.readFileSync('test-results/lv200-lv210-smoke-actual-combat.json')); if(d.errors.length||!d.rows.length||d.rows.some(r=>!r.damageReconciled)) process.exit(1); const summary={kind:'VERIFIED_COMBATTICK_SMOKE',commit:process.env.GITHUB_SHA,rows:d.rows.map(({level,job,fusion,weaponBuild,target,totalDamage,ownerDamage,petAttributedDamage,elapsedMs,kill,dead,hits,damageReconciled})=>({level,job,fusion,weaponBuild,target,totalDamage,ownerDamage,petAttributedDamage,elapsedMs,kill,dead,hits,damageReconciled}))}; fs.writeFileSync('docs/test-results/actual-combattick-smoke.json',JSON.stringify(summary,null,2)+'\\n');"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add docs/test-results/actual-combattick-smoke.json
          git diff --cached --quiet || (git commit -m "test: save real combat smoke evidence [skip ci]" && git push origin HEAD:experiment-weapon-balance-20261102)
      - name: Upload actual combat results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actual-game-combattick-smoke
          path: test-results/*.json
          if-no-files-found: ignore
