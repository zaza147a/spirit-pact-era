name: Isolated Weapon Fusion and Revival Validation
on:
  push:
    branches: [experiment-weapon-balance-20261102]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check main game module syntax
        run: |
          node --check dist/game.js
          node --check dist/pet-fusion.js
          node --check dist/pet-effects.js
          node --check dist/pet-abilities.js
      - name: Validate weapon, six unordered fusion routes, sixty resonances and revival
        run: |
          node --test --test-concurrency=2 tests/*.test.mjs
      - name: Generate 120-scenario diagnostic allocation output
        run: |
          mkdir -p test-results
          node tests/lv200-lv210-optimization-diagnostic.mjs > test-results/lv200-lv210-120-weapon-stat-diagnostic.json
          node -e "const d=require('./test-results/lv200-lv210-120-weapon-stat-diagnostic.json');if(d.rows.length!==120)throw Error('Expected 120 diagnostic rows');console.log('Diagnostic scenarios:',d.rows.length)"
      - name: Generate real-map six-fusion pet direct-hit diagnostics
        run: |
          mkdir -p test-results
          node tests/lv200-lv210-pet-output-diagnostic.mjs > test-results/lv200-lv210-120-pet-throughput-proxy.json
          node -e "const d=require('./test-results/lv200-lv210-120-pet-throughput-proxy.json');if(d.rows.length!==120)throw Error('Expected 120 pet rows');if(new Set(d.rows.filter(x=>x.level===200 && x.job==='assassin').map(x=>x.bossDpsProxy)).size<2)throw Error('Fusion outputs unexpectedly identical');console.log('Pet benchmark scenarios:',d.rows.length)"
      - name: Upload diagnostic results (not certified actual DPS)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lv200-lv210-120-weapon-proxy
          path: test-results/*.json
          if-no-files-found: ignore
