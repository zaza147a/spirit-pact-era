name: Homecoming desktop browser acceptance
on:
  push:
    branches: [feature/companion-homecoming]
    paths:
      - 'dist/game.js'
      - 'dist/index.html'
      - 'dist/town-scene.js'
      - 'dist/homecoming*'
      - 'dist/assets/homecoming/**'
      - 'scripts/browser/homecoming-acceptance.mjs'
      - '.github/workflows/homecoming-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: homecoming-desktop-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  journey:
    if: github.ref == 'refs/heads/feature/companion-homecoming'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium and CJK fonts
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify twelve journeys in the actual desktop game and preview
        run: node scripts/browser/homecoming-acceptance.mjs
      - name: Preserve report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homecoming-desktop-browser
          path: browser-qa/homecoming/
          retention-days: 14
