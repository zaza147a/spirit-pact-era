# Final source verification including companion terminology.
name: Current full five-boss matrix
on:
  push:
    branches: [feature/humanoid-pet-evolution]
    paths: [".github/workflows/full-current-matrix.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        job: [knight, crusader, wizard, sage, assassin, rogue, priest, monk, hunter, performer]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run all 240 ordered-fusion skill sets for this job
        run: node scripts/audit-five-boss-skill-combos.mjs --full --current --job=${{ matrix.job }}
      - uses: actions/upload-artifact@v4
        with:
          name: matrix-${{ matrix.job }}
          path: matrix-${{ matrix.job }}.json
  combine:
    needs: matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: matrix-*
          path: matrix-parts
          merge-multiple: true
      - name: Validate all cases and combine one-commit evidence
        run: node scripts/combine-current-matrix.mjs matrix-parts
      - uses: actions/upload-artifact@v4
        with:
          name: full-current-matrix
          path: docs/five-boss-full-skill-current.json
