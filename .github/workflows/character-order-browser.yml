name: Character selection ordering browser acceptance
on:
  push:
    branches: [feature/character-select-order-2026-11-09]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  character-order-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify ordering and slot isolation
        run: node --test tests/character-order*.test.mjs tests/character-slot-legacy-ledger.test.mjs
      - name: Install desktop Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify ordering, refresh, and selection in browser
        run: node scripts/browser/character-order-acceptance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: character-order-browser-evidence
          path: browser-qa/character-order/
          retention-days: 14
