name: Extreme trial new jobs attribute-profile screen
on:
  push:
    branches: [test/12-jobs-optimal-loadout-20261110]
    paths: ['.github/workflows/extreme-newjobs-attribute-search.yml']
permissions:
  contents: write
concurrency:
  group: extreme-newjobs-attribute-search
  cancel-in-progress: false
jobs:
  pactWarrior:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/12-jobs-optimal-loadout-20261110
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Screen all seven legal attribute profiles in actual HP and CLEAR
        env:
          EXTREME_JOB: pactWarrior
          EXTREME_FUSIONS: attack-support
          EXTREME_WEAPONS: aspdPct
          EXTREME_CARD_SLOT: headUpper
          EXTREME_CARD_ID: boss_skyport
          EXTREME_PROFILES: reference,agi-vit,luk-vit,dex-vit,agi-luk,vit-luk,dex-luk
          EXTREME_MODES: hp,clear
          EXTREME_OUTPUT: docs/current-extreme-seeded-v3-pactWarrior-attribute-search-20261111.json
        run: |
          set -euo pipefail
          node scripts/current-extreme-candidate-search.mjs
          node --test tests/current-extreme-results-integrity.test.mjs
          cat >> docs/handoff-12-jobs-loadout-2026-11-10.md <<'EOF'

          ## 分段交接：靈契君王七種合法配點實戰搜尋

          - 固定攻擊＋輔助、攻速武器、頭上王卡 boss_skyport，七種配點分別跑 HP/CLEAR 共 14 場，固定種子 20261110。
          - 報告：`docs/current-extreme-seeded-v3-pactWarrior-attribute-search-20261111.json`；此為限定配點搜尋，非全域最優。
          - 正式版 main 未變更。
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          git commit -m "test: screen pactWarrior legal attributes [skip ci]"
          git fetch origin test/12-jobs-optimal-loadout-20261110
          git rebase origin/test/12-jobs-optimal-loadout-20261110
          git push origin HEAD:test/12-jobs-optimal-loadout-20261110
  spiritCommander:
    needs: pactWarrior
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/12-jobs-optimal-loadout-20261110
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Screen all seven legal attribute profiles in actual HP and CLEAR
        env:
          EXTREME_JOB: spiritCommander
          EXTREME_FUSIONS: attack-magic
          EXTREME_WEAPONS: aspdPct
          EXTREME_CARD_SLOT: accessory2
          EXTREME_CARD_ID: boss_celestial
          EXTREME_PROFILES: reference,agi-vit,luk-vit,dex-vit,agi-luk,vit-luk,dex-luk
          EXTREME_MODES: hp,clear
          EXTREME_OUTPUT: docs/current-extreme-seeded-v3-spiritCommander-attribute-search-20261111.json
        run: |
          set -euo pipefail
          node scripts/current-extreme-candidate-search.mjs
          node --test tests/current-extreme-results-integrity.test.mjs
          cat >> docs/handoff-12-jobs-loadout-2026-11-10.md <<'EOF'

          ## 分段交接：萬靈宗師七種合法配點實戰搜尋

          - 固定攻擊＋魔法、攻速武器、飾品2王卡 boss_celestial，七種配點分別跑 HP/CLEAR 共 14 場，固定種子 20261110。
          - 報告：`docs/current-extreme-seeded-v3-spiritCommander-attribute-search-20261111.json`；此為限定配點搜尋，非全域最優。
          - 正式版 main 未變更。
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          git commit -m "test: screen spiritCommander legal attributes [skip ci]"
          git fetch origin test/12-jobs-optimal-loadout-20261110
          git rebase origin/test/12-jobs-optimal-loadout-20261110
          git push origin HEAD:test/12-jobs-optimal-loadout-20261110
