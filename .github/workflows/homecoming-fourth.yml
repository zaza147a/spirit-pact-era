name: Homecoming fourth-slot prototype (10 jobs)
on:
  push:
    branches: [feature/companion-homecoming]
    paths:
      - dist/companion-fourth-skill.js
      - scripts/homecoming-fourth-audit.mjs
      - scripts/homecoming-fourth-runtime.patch
      - tests/companion-fourth-skill.test.mjs
      - .github/workflows/homecoming-fourth.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: homecoming-fourth
  cancel-in-progress: true
env:
  AUDIT_SOURCE_SHA: 0a61d28cb8237a5d9a4dd472c300f7c845b197ac
  AUDIT_SKIP_SCREEN: '1'
jobs:
  pilot:
    if: github.ref == 'refs/heads/feature/companion-homecoming'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: tooling
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUDIT_SOURCE_SHA }}
          path: source
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated prototype
        working-directory: source
        run: |
          cp ../tooling/dist/companion-fourth-skill.js dist/companion-fourth-skill.js
          cp ../tooling/scripts/homecoming-fourth-audit.mjs scripts/homecoming-fourth-audit.mjs
          cp ../tooling/tests/companion-fourth-skill.test.mjs tests/companion-fourth-skill.test.mjs
          mkdir -p docs/homecoming-audit
          cp ../tooling/docs/homecoming-audit/results.json docs/homecoming-audit/results.json
          git apply --check ../tooling/scripts/homecoming-fourth-runtime.patch
          git apply ../tooling/scripts/homecoming-fourth-runtime.patch
      - name: State and unlock tests
        working-directory: source
        run: node --test tests/companion-fourth-skill.test.mjs
      - name: Disabled prototype preserves the completed baseline
        working-directory: source
        env:
          HOMECOMING_FOURTH: '0'
        run: |
          node scripts/homecoming-fourth-audit.mjs knight
          node --input-type=module -e "import fs from 'node:fs'; import assert from 'node:assert/strict'; const a=JSON.parse(fs.readFileSync('docs/homecoming-audit/knight-control.json')),b=JSON.parse(fs.readFileSync('docs/homecoming-audit/results.json')); for(const r of a.rows){const old=b.rows.find(x=>x.job===r.job&&x.pair===r.pair&&x.scenario===r.scenario&&x.seed===r.seed);assert.equal(r.kills,old.kills);assert.equal(r.totalDps,old.totalDps);assert.deepEqual(r.metrics,old.metrics);} console.log('All 36 disabled-control rows match baseline exactly');"
  matrix:
    needs: pilot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        job: [knight, crusader, wizard, sage, assassin, rogue, priest, monk, hunter, performer]
    steps:
      - uses: actions/checkout@v4
        with:
          path: tooling
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUDIT_SOURCE_SHA }}
          path: source
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated prototype
        working-directory: source
        run: |
          cp ../tooling/dist/companion-fourth-skill.js dist/companion-fourth-skill.js
          cp ../tooling/scripts/homecoming-fourth-audit.mjs scripts/homecoming-fourth-audit.mjs
          mkdir -p docs/homecoming-audit
          cp ../tooling/docs/homecoming-audit/results.json docs/homecoming-audit/results.json
          git apply ../tooling/scripts/homecoming-fourth-runtime.patch
      - name: Confirm fourth-slot affinity in three scenarios
        working-directory: source
        env:
          HOMECOMING_FOURTH: '1'
        run: node scripts/homecoming-fourth-audit.mjs ${{ matrix.job }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homecoming-fourth-${{ matrix.job }}
          path: source/docs/homecoming-audit/${{ matrix.job }}-fourth.json
          if-no-files-found: warn
          retention-days: 30
