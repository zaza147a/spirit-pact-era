name: Pages full regression (on demand)
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'dist/**'
      - 'wiki/**'
      - 'tests/**'
      - '.github/workflows/github-pages.yml'
      - '.github/workflows/pages-full-regression.yml'
permissions:
  contents: read
concurrency:
  group: pages-full-regression-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run complete existing regression suite
        run: node --test --test-concurrency=2 tests/*.test.mjs
