name: Completed spirit feature acceptance (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: completed-spirit-acceptance-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  completed-features:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify bulk category sales and item protection
        run: node tests/bulk-sale-regression.mjs
      - name: Verify boss card rarity and compound salvage conditions
        run: node tests/boss-card-salvage-regression.mjs
      - name: Smoke test real offline Node Worker
        run: node tests/offline-worker-smoke.mjs
      - name: Run offline optimizer regression
        run: node tests/offline-optimizer-regression.mjs
      - name: Run dual-pet UI regression
        run: node tests/spirit-dual-ui-regression.mjs
      - name: Validate eight spirit job portraits
        run: node tests/spirit-job-portrait-assets.test.mjs
      - name: Validate six S/SS/SSS spirit rank outfits
        run: node tests/spirit-rank-outfits.test.mjs
  gear-quality-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare actual 200/210 combat across normal legendary mythic gear
        run: node tests/spirit-gear-quality-observation.mjs
  rare-resonance-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Five low-frequency dual resonances at 200/210 for 5m and two seeds
        run: node tests/spirit-rare-resonance-observation.mjs
  survival-economy-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare twelve 200/210 defensive and offensive fusion farm scenarios
        run: node tests/spirit-offline-survival-economy-observation.mjs
  twelve-profession-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare twelve 200/210 professions through real offline combat
        run: node tests/spirit-vs-ten-jobs-combat-observation.mjs

  spirit-underlevel-legacy-control:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare all twelve classes with actual Lv170/180 unenhanced gear on 191-200 map
        run: node tests/spirit-underlevel-legacy-control.mjs
  spirit-underlevel-map-survival:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare Lv170/180 gear in 191-200 and strictly SSS in 201-210
        run: node tests/spirit-underlevel-map-survival.mjs
  spirit-200-mythic-five-boss:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test 16 Lv200 five-boss attempts with mythic gear only
        run: node tests/spirit-200-low-gear-five-boss.mjs
