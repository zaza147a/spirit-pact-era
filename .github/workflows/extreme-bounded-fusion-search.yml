name: Extreme trial bounded fusion and weapon search
on:
  push:
    branches: [test/12-jobs-optimal-loadout-20261110]
    paths: ['.github/workflows/extreme-bounded-fusion-search.yml']
permissions:
  contents: write
concurrency:
  group: extreme-bounded-fusion-search
  cancel-in-progress: false
jobs:
  pactWarrior:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/12-jobs-optimal-loadout-20261110
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Search six fusions and two weapon affixes in actual HP and CLEAR trials
        env:
          EXTREME_JOB: pactWarrior
          EXTREME_MODES: hp,clear
          EXTREME_OUTPUT: docs/current-extreme-seeded-v3-fusion-search-pactWarrior-20261111.json
        run: |
          set -euo pipefail
          node scripts/current-extreme-candidate-search.mjs
          node --test tests/current-extreme-results-integrity.test.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cat >> docs/handoff-12-jobs-loadout-2026-11-10.md <<'EOF'

          ## 分段交接：固定種子融合寵與武器特性搜尋（靈契君王）

          - 真實極限試煉 HP/CLEAR，六種融合寵 × 兩種武器特性，共 12 組候選、24 場測試，固定種子 20261110。
          - 結果：`docs/current-extreme-seeded-v3-fusion-search-pactWarrior-20261111.json`；其中 best 為此次有限搜尋最佳，不代表全域最優。
          - 未變更正式版。
          EOF
          git add docs/
          git commit -m "test: search pactWarrior fusion and weapon choices [skip ci]"
          git fetch origin test/12-jobs-optimal-loadout-20261110
          git rebase origin/test/12-jobs-optimal-loadout-20261110
          git push origin HEAD:test/12-jobs-optimal-loadout-20261110
  spiritCommander:
    needs: pactWarrior
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/12-jobs-optimal-loadout-20261110
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Search six fusions and two weapon affixes in actual HP and CLEAR trials
        env:
          EXTREME_JOB: spiritCommander
          EXTREME_MODES: hp,clear
          EXTREME_OUTPUT: docs/current-extreme-seeded-v3-fusion-search-spiritCommander-20261111.json
        run: |
          set -euo pipefail
          node scripts/current-extreme-candidate-search.mjs
          node --test tests/current-extreme-results-integrity.test.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cat >> docs/handoff-12-jobs-loadout-2026-11-10.md <<'EOF'

          ## 分段交接：固定種子融合寵與武器特性搜尋（萬靈宗師）

          - 真實極限試煉 HP/CLEAR，六種融合寵 × 兩種武器特性，共 12 組候選、24 場測試，固定種子 20261110。
          - 結果：`docs/current-extreme-seeded-v3-fusion-search-spiritCommander-20261111.json`；其中 best 為此次有限搜尋最佳，不代表全域最優。
          - 未變更正式版。
          EOF
          git add docs/
          git commit -m "test: search spiritCommander fusion and weapon choices [skip ci]"
          git fetch origin test/12-jobs-optimal-loadout-20261110
          git rebase origin/test/12-jobs-optimal-loadout-20261110
          git push origin HEAD:test/12-jobs-optimal-loadout-20261110
