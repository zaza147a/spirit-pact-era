name: Extreme mantles 48 real browser acceptance (test branch)
on:
  push:
    branches: [feature/endless-trials-three-bosses]
    paths:
      - 'scripts/browser/extreme-mantles-48-acceptance.mjs'
      - '.github/workflows/extreme-mantles-browser-acceptance.yml'
      - 'dist/assets/extreme/mantles-v2/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify 48 asset formats and extreme trial behavior
        run: |
          python3 -m pip install --user pillow
          python3 scripts/art/audit-extreme-mantle-alpha.py --strict
          node --test tests/extreme-*.test.mjs
      - name: Install isolated browser runner
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Visit the real game UI for 48 outfits and both views
        run: node scripts/browser/extreme-mantles-48-acceptance.mjs
      - name: Upload all visual evidence and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extreme-mantles-48-browser-evidence
          path: browser-qa/extreme-mantles-48/
