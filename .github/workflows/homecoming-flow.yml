name: Homecoming flow
on:
  push:
    branches: [feature/companion-homecoming]
    paths:
      - 'dist/homecoming-*'
      - 'dist/companion-fourth-skill.js'
      - 'tests/homecoming-*.test.mjs'
      - '.github/workflows/homecoming-flow.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check module syntax
        run: |
          node --check dist/homecoming-data.js
          node --check dist/homecoming-state.js
      - name: Verify independent quest state and fourth slot
        run: node --test tests/homecoming-state.test.mjs tests/homecoming-preview.test.mjs tests/companion-fourth-skill.test.mjs
