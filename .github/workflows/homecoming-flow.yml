name: Homecoming flow
on:
  push:
    branches: [feature/companion-homecoming]
    paths:
      - 'dist/homecoming*'
      - 'dist/game.js'
      - 'dist/index.html'
      - 'dist/adventure-progression.js'
      - 'dist/frontier.js'
      - 'dist/encounter-rules.js'
      - 'dist/offline-worker.js'
      - 'dist/shared-warehouse.js'
      - 'dist/assets/homecoming/**'
      - 'dist/companion-fourth-skill.js'
      - 'tests/homecoming-*.test.mjs'
      - '.github/workflows/homecoming-flow.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check module syntax
        run: |
          node --check dist/game.js
          node --check dist/homecoming-runtime.js
          node --check dist/homecoming-ui.js
          node --check dist/homecoming-data.js
          node --check dist/homecoming-state.js
          node --check dist/homecoming-adventures.js
          node --check dist/homecoming-art.js
          node --check dist/homecoming-encounters.js
      - name: Verify independent quest state and fourth slot
        run: node --test tests/homecoming-state.test.mjs tests/homecoming-preview.test.mjs tests/companion-fourth-skill.test.mjs tests/homecoming-assets.test.mjs tests/homecoming-game.test.mjs tests/unordered-fusion-instant-town-revive.test.mjs tests/combat-contribution.test.mjs tests/role-damage-budget.test.mjs tests/shared-warehouse.test.mjs
