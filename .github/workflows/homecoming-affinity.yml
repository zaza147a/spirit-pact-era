name: Homecoming companion affinity (10 original jobs)
on:
  push:
    branches: [feature/companion-homecoming]
    paths:
      - scripts/homecoming-affinity-audit.mjs
      - .github/workflows/homecoming-affinity.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: homecoming-affinity
  cancel-in-progress: true
env:
  AUDIT_SOURCE_SHA: 0a61d28cb8237a5d9a4dd472c300f7c845b197ac
jobs:
  pilot:
    if: github.ref == 'refs/heads/feature/companion-homecoming'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          path: tooling
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUDIT_SOURCE_SHA }}
          path: source
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Copy audit harness
        run: cp tooling/scripts/homecoming-affinity-audit.mjs source/scripts/homecoming-affinity-audit.mjs
      - name: Verify lethal combat and damage attribution
        working-directory: source
        run: node scripts/homecoming-affinity-audit.mjs knight --pilot
  matrix:
    needs: pilot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        job: [knight, crusader, wizard, sage, assassin, rogue, priest, monk, hunter, performer]
    steps:
      - uses: actions/checkout@v4
        with:
          path: tooling
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUDIT_SOURCE_SHA }}
          path: source
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Copy audit harness
        run: cp tooling/scripts/homecoming-affinity-audit.mjs source/scripts/homecoming-affinity-audit.mjs
      - name: Three scenarios and twenty skill combinations
        working-directory: source
        run: node scripts/homecoming-affinity-audit.mjs ${{ matrix.job }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homecoming-affinity-${{ matrix.job }}
          path: source/docs/homecoming-audit/${{ matrix.job }}.json
          if-no-files-found: warn
          retention-days: 30
