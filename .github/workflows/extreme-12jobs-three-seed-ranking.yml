name: Extreme 12 jobs final three-seed ranking
on:
  push:
    branches: [test/12-jobs-optimal-loadout-20261110]
    paths: ['docs/current-extreme-12jobs-winner-three-seed-spiritCommander-20261111.json']
permissions:
  contents: write
jobs:
  rank:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/12-jobs-optimal-loadout-20261110
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate all 144 results and calculate conclusive three-seed rankings
        run: |
          set -euo pipefail
          node scripts/current-extreme-12jobs-three-seed-ranking.mjs
          git fetch origin test/12-jobs-optimal-loadout-20261110
          git reset --mixed origin/test/12-jobs-optimal-loadout-20261110
          git restore --source=origin/test/12-jobs-optimal-loadout-20261110 --staged --worktree docs/handoff-12-jobs-loadout-2026-11-10.md
          cat >> docs/handoff-12-jobs-loadout-2026-11-10.md <<'EOF'

          ## 分段交接：12 職業 × 四試煉 × 三種子完整複驗

          - 報告 `docs/current-extreme-12jobs-four-modes-three-seed-ranking-20261111.json`，共 144 場真實極限試煉。
          - 各模式僅排名三種子全部首次失敗的候選，截尾結果另外列出。
          - 此為已搜尋候選的驗證排序，非全域最優；main 未變更。
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/current-extreme-12jobs-four-modes-three-seed-ranking-20261111.json docs/handoff-12-jobs-loadout-2026-11-10.md
          git commit -m "report: record 144-trial four-mode three-seed rankings [skip ci]"
          git push origin HEAD:test/12-jobs-optimal-loadout-20261110
