name: Full pet evolution visual acceptance
on:
  push:
    branches: [main]
    paths:
      - "scripts/browser/evolution-matrix-acceptance.mjs"
      - "dist/evolution-motion.css"
      - "dist/index.html"
      - ".github/workflows/evolution-matrix.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evolution-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser runtime
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Install engine
        run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Run regression tests
        run: node --test tests/evolution-motion-regression.test.mjs tests/pet-evolution.test.mjs
      - name: Exercise 160 real artwork states and 16 visual animations
        env:
          BROWSER_ENGINE: ${{ matrix.engine }}
        run: node scripts/browser/evolution-matrix-acceptance.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evolution-matrix-${{ matrix.engine }}
          path: browser-qa/evolution-matrix/
