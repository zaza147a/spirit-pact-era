name: Homecoming pre-MAIN acceptance
on:
  push:
    branches: [feature/companion-homecoming]
    paths:
      - '.github/workflows/homecoming-premerge.yml'
      - 'scripts/release/homecoming-premerge*'
      - 'scripts/browser/homecoming-premerge-entry.mjs'
      - 'scripts/browser/spirit-premerge-acceptance.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  premerge:
    if: github.ref == 'refs/heads/feature/companion-homecoming'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and targeted release regressions
        run: |
          node --check dist/game.js
          node --check dist/offline-worker.js
          node --input-type=module -e "import {spawnSync} from 'node:child_process'; import fs from 'node:fs'; const files=JSON.parse(fs.readFileSync('scripts/release/homecoming-premerge-tests.json')); const r=spawnSync(process.execPath,['--test','--test-concurrency=2',...files],{stdio:'inherit'}); process.exit(r.status??1);"
      - name: Stage Pages files and verify references without deployment
        run: node scripts/release/homecoming-premerge-stage.mjs
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify latest MAIN portrait layout and gold selection persistence
        run: node scripts/browser/homecoming-premerge-entry.mjs
      - name: Verify creator, eight slots, both new jobs, warehouse and NPC transfers
        run: node scripts/browser/spirit-premerge-acceptance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homecoming-premerge-evidence
          path: |
            artifacts/homecoming-premerge/
            artifacts/spirit-premerge/
            browser-qa/homecoming-premerge/
          retention-days: 14
