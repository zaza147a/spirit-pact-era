name: Full Real Combat 200 and 210 - TEST BRANCH ONLY
on:
  push:
    branches: [experiment-weapon-balance-20261102]
    paths:
      - '.github/workflows/actual-combat-120.yml'
      - 'tests/real-combat-browser-benchmark.mjs'
      - 'tests/rank-actual-combat-120.mjs'
      - 'tests/rank-natural-map-combat.mjs'
      - 'dist/game.js'
      - 'dist/pet-fusion.js'
      - 'dist/pet-abilities.js'
      - 'dist/pet-effects.js'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  real-combat-120:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install real browser runtime
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Smoke-test actual game combatTick before full 120 benchmark
        run: node tests/real-combat-browser-benchmark.mjs farm-smoke
      - name: Execute 120 actual in-game combat scenarios against both maps
        run: node tests/real-combat-browser-benchmark.mjs farm
      - name: Rank only fully reconciled combatTick evidence
        run: node tests/rank-natural-map-combat.mjs test-results/lv200-lv210-farm-actual-combat.json
      - name: Publish validated 120-row actual battle summary to isolated branch
        run: |
          node --input-type=module -e "import fs from 'node:fs';const x=JSON.parse(fs.readFileSync('test-results/actual-natural-map-120-ranked.json','utf8'));if(x.kind!=='ACTUAL_NATURAL_MAP_DPS'||x.rows.length!==180)throw Error('Missing 180 natural map records');fs.mkdirSync('docs/test-results',{recursive:true});fs.writeFileSync('docs/test-results/actual-natural-map-120-ranked.json',JSON.stringify({kind:x.kind,commit:process.env.GITHUB_SHA,rows:x.rows},null,2)+'\\n')"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git fetch origin experiment-weapon-balance-20261102
          git switch -C experiment-weapon-balance-20261102 origin/experiment-weapon-balance-20261102
          git add docs/test-results/actual-combat-120-ranked.json
          if ! git diff --cached --quiet; then
            git commit -m "test: verified natural map combat results [skip ci]"
            git push origin HEAD:experiment-weapon-balance-20261102
          fi
      - name: Preserve raw combat outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spirit-pact-actual-combat-120-raw
          path: test-results/*.json
          if-no-files-found: warn
