name: Homecoming fourth skill browser boundaries
on:
  push:
    branches: [feature/companion-homecoming]
    paths:
      - 'scripts/browser/homecoming-fourth-acceptance.mjs'
      - '.github/workflows/homecoming-fourth-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: homecoming-fourth-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fourth:
    if: github.ref == 'refs/heads/feature/companion-homecoming'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify six skill boundaries and real-time charge and pause
        run: node scripts/browser/homecoming-fourth-acceptance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homecoming-fourth-browser
          path: browser-qa/homecoming-fourth/
          retention-days: 14
