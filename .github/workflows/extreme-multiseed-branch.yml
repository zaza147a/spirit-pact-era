name: Extreme trial multiseed verification - seeded v3
on:
  push:
    branches: [test/12-jobs-optimal-loadout-20261110]
    paths: ['.github/workflows/extreme-multiseed-branch.yml']
permissions:
  contents: write
concurrency:
  group: extreme-trial-multiseed
  cancel-in-progress: false
jobs:
  knight:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/12-jobs-optimal-loadout-20261110
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run actual trial, verify and commit each mode
        env:
          EXTREME_JOB: knight
          EXTREME_SEEDS: '20261110,20261111,20261112'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for mode in atk matk hp clear; do
            EXTREME_MODES="$mode" node scripts/current-extreme-multiseed-followup.mjs
            node --test tests/current-extreme-results-integrity.test.mjs
            git add docs/current-extreme-seeded-v3-"$EXTREME_JOB"-"$mode"-20261111.json docs/handoff-12-jobs-loadout-2026-11-10.md
            git commit -m "test: verify $EXTREME_JOB $mode cross-seed trial and handoff [skip ci]"
            git fetch origin test/12-jobs-optimal-loadout-20261110
            git rebase origin/test/12-jobs-optimal-loadout-20261110
            git push origin HEAD:test/12-jobs-optimal-loadout-20261110
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multiseed-knight
          path: docs/current-extreme-seeded-v3-knight-*.json
          if-no-files-found: warn
