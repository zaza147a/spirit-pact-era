name: Publish Spirit Pact Era
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify game and saved balance report
        run: node --test --test-concurrency=2 tests/*.test.mjs
      - name: Stage automatically synced WIKI
        run: |
          mkdir -p dist/wiki
          cp wiki/index.html dist/wiki/index.html
          test -s dist/wiki/index.html
          test -s dist/catalog.js
          test -s dist/loot.js
          node --input-type=module -e "import fs from 'node:fs'; const s=fs.readFileSync('dist/wiki/index.html','utf8'); const paths=[...s.matchAll(/from '\\.\\.\\/([^']+)'/g)].map(x=>x[1].split(/[?#]/,1)[0]); for(const p of paths){ if(!fs.existsSync('dist/'+p)) throw Error('Missing WIKI dependency '+p); } console.log('WIKI dependency check:',paths.length,'modules')"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload game
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
