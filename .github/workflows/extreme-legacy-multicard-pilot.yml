name: Extreme trial legacy multi-card pilot
on:
  push:
    branches: [test/12-jobs-optimal-loadout-20261110]
    paths: ['.github/workflows/extreme-legacy-multicard-pilot.yml']
permissions:
  contents: write
jobs:
  knight:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/12-jobs-optimal-loadout-20261110
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run Knight multi-card real-trial optimization
        env:
          EXTREME_JOB: knight
        run: |
          set -euo pipefail
          node scripts/current-extreme-legacy-multicard.mjs
          cat >> docs/handoff-12-jobs-loadout-2026-11-10.md <<'EOF'

          ## 分段交接：騎士多王卡實戰搜尋

          - 沿用 seeded-v3 HP/CLEAR 的合法武器、融合寵、王卡候選，以及配點搜尋勝出者；逐部位實測多卡替換。
          - 報告：`docs/current-extreme-multicard-coordinate-knight-summary-20261111.json`；有限搜尋，非全域最優。
          - main 未變更。
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          git commit -m "test: record knight multi-card trial pilot [skip ci]"
          git fetch origin test/12-jobs-optimal-loadout-20261110
          git rebase origin/test/12-jobs-optimal-loadout-20261110
          git push origin HEAD:test/12-jobs-optimal-loadout-20261110
  crusader:
    needs: knight
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/12-jobs-optimal-loadout-20261110
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run Crusader multi-card real-trial optimization
        env:
          EXTREME_JOB: crusader
        run: |
          set -euo pipefail
          node scripts/current-extreme-legacy-multicard.mjs
          cat >> docs/handoff-12-jobs-loadout-2026-11-10.md <<'EOF'

          ## 分段交接：十字軍多王卡實戰搜尋

          - 沿用 seeded-v3 HP/CLEAR 的合法武器、融合寵、王卡候選，以及配點搜尋勝出者；逐部位實測多卡替換。
          - 報告：`docs/current-extreme-multicard-coordinate-crusader-summary-20261111.json`；有限搜尋，非全域最優。
          - main 未變更。
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          git commit -m "test: record crusader multi-card trial pilot [skip ci]"
          git fetch origin test/12-jobs-optimal-loadout-20261110
          git rebase origin/test/12-jobs-optimal-loadout-20261110
          git push origin HEAD:test/12-jobs-optimal-loadout-20261110
