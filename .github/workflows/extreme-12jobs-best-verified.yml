name: Extreme 12 jobs best verified same-seed configurations (include weapon tiebreak)
on:
  push:
    branches: [test/12-jobs-optimal-loadout-20261110]
    paths: ['.github/workflows/extreme-12jobs-best-verified.yml']
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/12-jobs-optimal-loadout-20261110
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Select higher three-seed mean of verified legal configurations
        run: |
          set -euo pipefail
          node scripts/current-extreme-12jobs-best-verified.mjs
          git fetch origin test/12-jobs-optimal-loadout-20261110
          git reset --mixed origin/test/12-jobs-optimal-loadout-20261110
          git restore --source=origin/test/12-jobs-optimal-loadout-20261110 --staged --worktree docs/handoff-12-jobs-loadout-2026-11-10.md
          cat >> docs/handoff-12-jobs-loadout-2026-11-10.md <<'EOF'

          ## 分段交接：12 職業四模式已驗證最佳候選

          - 對照 `docs/current-extreme-12jobs-four-modes-progress-20261111.json` seeded-v3 三種子基準與 `docs/current-extreme-12jobs-four-modes-three-seed-ranking-20261111.json` 新候選複測。
          - 每職業每模式選擇相同三種子平均層數較高的合法配置，避免較弱的新搜尋覆蓋舊基準。
          - 輸出 `docs/current-extreme-12jobs-best-verified-three-seed-20261111.json`；已測最佳不等於全域最優。main 未變更。
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/current-extreme-12jobs-best-verified-three-seed-20261111.json docs/handoff-12-jobs-loadout-2026-11-10.md
          git commit -m "report: preserve strongest measured three-seed configurations [skip ci]"
          git push origin HEAD:test/12-jobs-optimal-loadout-20261110
