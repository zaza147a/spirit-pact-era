name: Extreme trial ten old jobs attribute optimization
on:
  push:
    branches: [test/12-jobs-optimal-loadout-20261110]
    paths: ['.github/workflows/extreme-oldjobs-attribute-screen.yml']
permissions:
  contents: write
concurrency:
  group: extreme-oldjobs-attribute-screen
  cancel-in-progress: false
jobs:
  knight:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/12-jobs-optimal-loadout-20261110
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run actual HP and CLEAR trials across seven legal attribute profiles
        env:
          EXTREME_JOB: knight
        run: |
          set -euo pipefail
          node scripts/current-extreme-oldjobs-attribute-screen.mjs
          node --test tests/current-extreme-results-integrity.test.mjs
          cat >> docs/handoff-12-jobs-loadout-2026-11-10.md <<'EOF'

          ## 分段交接：knight 七種合法配點 HP/CLEAR 實戰搜尋

          - 依據 seeded-v3 各模式基準候選，固定融合寵、武器與單卡覆蓋條件；七種合法配點 × HP/CLEAR，共 14 場實戰，種子 20261110。
          - 完整結果：`docs/current-extreme-seeded-v3-attribute-knight-summary-20261111.json`，以及 HP/CLEAR 分別的候選明細。有限搜尋，不代表全域最優。
          - 正式版 main 未變更。
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          git commit -m "test: screen knight attribute profiles [skip ci]"
          git fetch origin test/12-jobs-optimal-loadout-20261110
          git rebase origin/test/12-jobs-optimal-loadout-20261110
          git push origin HEAD:test/12-jobs-optimal-loadout-20261110
