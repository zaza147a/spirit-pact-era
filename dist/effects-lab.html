<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>靈契紀元 · 技能演出試驗場</title><style>
:root{color-scheme:dark;font-family:system-ui,"Noto Sans TC",sans-serif;color:#eee8dd;background:#0b1019}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 10%,#283b44 0,#151d2d 42%,#080c14 100%)}.wrap{max-width:1120px;margin:auto;padding:26px 24px 42px}.top{display:flex;align-items:center;gap:18px;justify-content:space-between}.eyebrow{letter-spacing:.26em;color:#e3c891;font-size:11px;font-weight:700}h1{font-size:clamp(23px,4vw,35px);margin:6px 0 4px;letter-spacing:.04em}p{color:#a8b9c5;line-height:1.7}.back{color:#dfcca5;text-decoration:none;border:1px solid #6e624a;padding:11px 16px;border-radius:8px}.bar{display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin:20px 0}.field{display:grid;gap:6px;flex:1;min-width:180px}.field label{font-size:12px;color:#bbcaD0}select,button{font:inherit;color:#f8f0dd;border:1px solid #657883;border-radius:9px;background:#1b2933;padding:12px 14px}select{width:100%}button{cursor:pointer}button:hover{border-color:#d2b370;background:#304454}button:focus-visible,select:focus-visible{outline:2px solid #e6bc6d;outline-offset:2px}.primary{background:linear-gradient(140deg,#a57b35,#cba560);color:#151a20;border:1px solid #e5c887;font-weight:800}.primary:hover{background:#e2b967;color:#12171a}.arena{position:relative;height:430px;border:1px solid #475969;border-radius:16px;overflow:hidden;background:radial-gradient(ellipse at 52% 0%,#34444d8c,transparent 58%),linear-gradient(172deg,#263843 0%,#1c2c37 42%,#131d23 43%,#1a292b 100%);box-shadow:inset 0 0 70px #03080c,inset 0 -25px 55px #0b1018,0 25px 60px #0006}.arena:before{content:"";position:absolute;inset:47% -50% -25%;background:repeating-linear-gradient(90deg,#b8d3b412 0 1px,transparent 1px 75px),repeating-linear-gradient(0deg,#b8d3b40e 0 1px,transparent 1px 54px);transform:perspective(360px) rotateX(67deg);transform-origin:top}.arena:after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 90px 20px #080d12}.stage-note{position:absolute;top:18px;left:20px;z-index:1;font-size:11px;letter-spacing:.12em;color:#91aab8}.combatants{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;height:100%;padding:42px clamp(18px,5vw,78px)}.source{width:152px;text-align:center;flex:none}.hero{position:relative;margin:auto;width:86px;height:108px;filter:drop-shadow(0 12px 9px #000c)}.hero:before{content:"";position:absolute;left:18px;top:2px;width:50px;height:45px;border:3px solid #eed29a;border-radius:45% 45% 32% 32%;background:linear-gradient(135deg,#fff0bd,#82724e 65%,#243644)}.hero:after{content:"";position:absolute;left:7px;bottom:2px;width:72px;height:69px;background:linear-gradient(145deg,#e6bd65,#6e8295 34%,#283f53 60%,#b38f58);clip-path:polygon(22% 2%,78% 2%,100% 65%,80% 100%,18% 100%,0 65%);border-radius:12px}.ground{height:12px;background:radial-gradient(ellipse,#cbdba945,transparent 72%);margin-top:10px}.name{font-size:13px;font-weight:750;color:#e8d0a0;margin-top:7px}.enemies{display:flex;gap:clamp(5px,2vw,24px);align-items:center;justify-content:flex-end;flex-wrap:nowrap}.enemy-target{display:flex;flex-direction:column;align-items:center;justify-content:center;width:clamp(65px,10vw,115px);height:150px;position:relative}.enemy-target:after{content:"";position:absolute;bottom:15px;width:72%;height:13px;background:radial-gradient(ellipse,#8bc3c35b,transparent 70%)}.core{width:65px;height:84px;background:linear-gradient(145deg,#b1dae0,#5f929b 28%,#314f69 55%,#96c7c1);clip-path:polygon(50% 0,91% 20%,100% 63%,50% 100%,0 63%,9% 20%);box-shadow:0 0 24px #8dcbd42a;filter:drop-shadow(0 0 5px #8cbdb9)}.enemy-target[data-target="dummy2"] .core{filter:hue-rotate(40deg)}.enemy-target[data-target="dummy3"] .core{filter:hue-rotate(110deg)}.enemy-label{position:absolute;bottom:-8px;font-size:11px;color:#a7bfc8;white-space:nowrap}.status{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin:16px 0;color:#aabbc3;font-size:12px}.tag{border:1px solid #566e6c;border-radius:50px;padding:6px 10px;background:#192c30}.desc{min-height:2.4em}.foot{border-top:1px solid #34434b;padding-top:16px;margin-top:20px;font-size:12px;color:#8ca0ad}.nav{display:flex;gap:8px}#skillName{font-size:21px;font-weight:800;color:#f6dfac;min-height:32px}#skillDetail{font-size:12px;color:#b1becb}@media(max-width:640px){.wrap{padding:18px 12px}.top{align-items:flex-start}.back{font-size:12px}.arena{height:310px}.combatants{padding:26px 8px;gap:3px}.source{width:75px}.hero{transform:scale(.7);transform-origin:bottom center;margin-top:-25px}.source .name{font-size:11px}.enemies{gap:0}.enemy-target{width:64px;height:125px}.core{width:36px;height:58px}.enemy-label{font-size:9px}.status{align-items:start}}
</style></head><body><main class="wrap"><header class="top"><div><div class="eyebrow">SPIRIT PACT · VFX WORKSHOP</div><h1>技能演出試驗場</h1><p>直接檢視各職業技能的演出與多目標命中，無須等待戰鬥技能冷卻。</p></div><a class="back" href="./index.html">返回遊戲</a></header><div class="bar"><div class="field"><label for="job">職業</label><select id="job"></select></div><div class="field"><label for="skill">技能</label><select id="skill"></select></div><div class="field" style="flex:0 0 auto;min-width:105px"><label for="targetMode">命中目標</label><select id="targetMode"><option value="auto">依技能</option><option value="one">單體</option><option value="three">三體</option></select></div><button class="primary" id="replay">▶ 播放演出</button></div><section class="arena" id="encounter"><div class="stage-note">PRESENTATION PREVIEW · NO DAMAGE</div><div class="combatants"><div class="source" id="character"><div class="hero"></div><div class="ground"></div><div class="name">施術角色</div></div><div class="enemies"><div class="enemy-target active" data-target="dummy1"><div class="core"></div><div class="enemy-label">目標 01</div></div><div class="enemy-target" data-target="dummy2"><div class="core"></div><div class="enemy-label">目標 02</div></div><div class="enemy-target" data-target="dummy3"><div class="core"></div><div class="enemy-label">目標 03</div></div></div></div></section><div class="status"><div><div id="skillName"></div><div id="skillDetail"></div></div><div class="nav"><button id="previous">← 上一招</button><button id="next">下一招 →</button></div></div><p class="desc" id="description"></p><div class="foot">此頁只播放與遊戲共用的視覺特效，不執行戰鬥傷害、技能冷卻或存檔寫入。演出為持續改善中的測試版本。</div></main><script type="module">
import {JOB_SKILLS} from './job-skills.js?v=6.5.0';
import {queueCombatVfx,getCinematicDiagnostics} from './skill-effects.js?v=26';
import {visualForSkill} from './skill-effects-presets.js?v=2';
const jobs={crusader:'皇家禁衛',knight:'騎士領主',wizard:'巫師',sage:'賢者',assassin:'十字斬首者',rogue:'逐影',priest:'大主教',monk:'修羅',hunter:'遊俠',performer:'宮廷樂師',swordsman:'劍士',acolyte:'服事',mage:'法師',thief:'盜賊',archer:'弓箭手'};
const jobSelect=document.getElementById('job'),skillSelect=document.getElementById('skill'),mode=document.getElementById('targetMode');
const diagnostic=document.createElement('div');diagnostic.id='cinematicDiagnostics';diagnostic.style.cssText='margin:12px 0;padding:10px 14px;border:1px solid #a7884b;border-radius:8px;background:#1a2830;color:#f9dfa2;font-size:12px';document.querySelector('.foot').before(diagnostic);
function showDiagnostics(){const d=getCinematicDiagnostics();diagnostic.textContent='特效引擎 '+d.version+'｜'+d.status+'｜繪圖 '+(d.canvas?'已建立':'未建立')+'｜皇家素材 '+(d.royalArt?'已載入':'載入中')+'｜系統減少動態 '+(d.reducedMotion?'開':'關');}
showDiagnostics();
for(const key of Object.keys(jobs).filter(key=>JOB_SKILLS[key])){const el=document.createElement('option');el.value=key;el.textContent=jobs[key];jobSelect.append(el);}
function skills(){return (JOB_SKILLS[jobSelect.value]||[]).filter(s=>s.kind!=='passive');}
function refreshSkills(){const old=skillSelect.value;skillSelect.replaceChildren();for(const s of skills()){const opt=document.createElement('option');opt.value=s.id;opt.textContent=`${s.branch==='third'?'三轉 · ':''}${s.name}`;skillSelect.append(opt);}if(skills().some(s=>s.id===old))skillSelect.value=old;else if(jobSelect.value==='crusader')skillSelect.value='thirdMain_crusader';describe();}
function selected(){return skills().find(s=>s.id===skillSelect.value)||skills()[0];}
function describe(){const s=selected();if(!s)return;document.getElementById('skillName').textContent=s.name;document.getElementById('skillDetail').textContent=`${s.id} · ${visualForSkill({skillId:s.id,name:s.name,kind:s.kind})} · ${s.kind}`;document.getElementById('description').textContent=s.desc||'依照技能名稱的特效演出';}
function replay(){const s=selected();if(!s)return;const multi=mode.value==='three'||(mode.value==='auto'&&(s.targets>1||s.aoe||s.id==='thirdMain_crusader'));const targetIds=multi?['dummy1','dummy2','dummy3']:['dummy1'];queueCombatVfx({source:'skill',skillId:s.id,name:s.name,kind:s.kind,range:['hunter','performer','archer','wizard','priest'].includes(jobSelect.value)?'ranged':'melee',targetIds,finisher:s.id.startsWith('thirdFinish_'),aoe:multi,preview:true});setTimeout(showDiagnostics,130);}
jobSelect.addEventListener('change',()=>{refreshSkills();replay();});skillSelect.addEventListener('change',()=>{describe();replay();});mode.addEventListener('change',replay);document.getElementById('replay').addEventListener('click',replay);
function step(n){const opts=[...skillSelect.options],i=opts.findIndex(o=>o.value===skillSelect.value);skillSelect.value=opts[(i+n+opts.length)%opts.length].value;describe();replay();}
document.getElementById('previous').addEventListener('click',()=>step(-1));document.getElementById('next').addEventListener('click',()=>step(1));jobSelect.value='crusader';refreshSkills();
const loop=document.createElement('button');loop.textContent='↻ 循環播放：關';document.getElementById('replay').after(loop);let loopTimer=0;loop.addEventListener('click',()=>{if(loopTimer){clearInterval(loopTimer);loopTimer=0;loop.textContent='↻ 循環播放：關';return;}replay();loopTimer=setInterval(replay,3100);loop.textContent='■ 循環播放：開';});
</script></body></html>
