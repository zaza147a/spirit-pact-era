<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>靈契紀元｜武器改版補償測試站</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 40% 0,#2c405b,#0b1826 70%);color:#ebddbd;font-family:system-ui,'Noto Sans TC',sans-serif}main{max-width:720px;margin:20px;padding:32px;border:1px solid #b59449;border-radius:18px;background:#142433;box-shadow:0 24px 60px #0008}h1{font-size:28px;margin:8px 0 16px}.tag{color:#d9b965;letter-spacing:.18em;font-size:12px}p,li{line-height:1.9;color:#bfd2db}button,a.action{display:inline-block;border:1px solid #d3b462;border-radius:8px;padding:13px 20px;background:#a77c2e;color:#151c24;font-size:16px;font-weight:700;cursor:pointer;text-decoration:none;margin:8px 8px 8px 0}.secondary{background:#24384a!important;color:#edd9a8!important}#status{min-height:2em;color:#f2c77d}small{color:#8eafc0}</style></head><body><main><div class="tag">SPIRIT PACT ERA · TEST ONLY</div><h1>⚔ 武器改版補償體驗站</h1><p>此頁使用真實遊戲流程。點擊下方按鈕將在目前瀏覽器的第一角色格寫入測試角色，前往遊戲後進入角色、結算離線獎勵，即會出現一次性的武器自選視窗。</p><ul><li>測試角色：210 等刺客，持有更新前的 Lv.200 神話 SSS 拳刃</li><li>可選拳刃、短劍＋盾使用的短劍，或雙短劍組合</li><li>選武器時顯示固有特性，另可自訂合法一般詞條及神話特殊詞條</li><li>完成領取後寫入存檔，不會重複觸發</li></ul><button id="start">建立第一格測試角色並進入遊戲</button><button id="download" class="secondary">下載測試存檔 JSON</button><p id="status" role="status"></p><small>注意：測試資料會覆蓋本瀏覽器目前網站的第一角色格。建議使用無痕視窗或獨立測試站網址；此測試頁不會主動更動任何正式網站。</small></main><script type="module">
const file='./test-saves/weapon-compensation-assassin-200.json';
async function sample(){const response=await fetch(file,{cache:'no-store'});if(!response.ok)throw Error('無法載入測試存檔');const data=await response.json();data.player.offline={at:Date.now()-120000,enabled:true};delete data.player.weaponCompensation;return data;}
const status=document.getElementById('status');
document.getElementById('start').onclick=async()=>{try{const data=await sample();if(localStorage.getItem('icarus-character-slot-1')&&!confirm('第一角色格已有資料，確定覆蓋？建議先匯出備份。'))return;localStorage.setItem('icarus-character-slot-1',JSON.stringify(data));status.textContent='已建立。正在開啟遊戲，請點擊第一個角色格進入。';location.href='./index.html';}catch(error){status.textContent=error.message;}};
document.getElementById('download').onclick=async()=>{try{const data=await sample();const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='weapon-compensation-assassin-200.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);status.textContent='已下載，離線時間設定為現在以前 2 分鐘。';}catch(error){status.textContent=error.message;}};
</script></body></html>
