<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>十二大陸・任務美術展示</title><style>
*{box-sizing:border-box}body{margin:0;background:#111923;color:#e8edf3;font:16px/1.6 system-ui}main{max-width:1240px;margin:auto;padding:28px}a{color:#a9ceff}h1{margin-bottom:8px}p{color:#b4c5d6}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:20px}figure{margin:0;background:#1c2938;border:1px solid #3a5067;border-radius:12px;overflow:hidden}img{display:block;width:100%;height:auto}figcaption{padding:14px}small{display:block;color:#afc0d1}#opponents img{aspect-ratio:1;object-fit:contain;background:radial-gradient(#344b60,#192431)}h2{margin-top:36px}</style><main><a href="homecoming-preview.html">返回返鄉流程測試</a><h1>十二大陸・任務美術</h1><p>每條任務各有一張關鍵場景；七種戰鬥角色對應八個戰鬥節點。以下為任務場景，首次旅行分鏡另行製作。</p><h2>十二處任務現場</h2><div id="scenes" class="grid"></div><h2>任務對手與演武師父</h2><div id="opponents" class="grid"></div></main><script type="module">
import {HOMECOMING_ROUTES} from './homecoming-data.js';
import {HOMECOMING_ADVENTURES} from './homecoming-adventures.js';
import {HOMECOMING_OPPONENTS} from './homecoming-encounters.js';
import {HOMECOMING_SCENE_ART} from './homecoming-art.js';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.querySelector('#scenes').innerHTML=HOMECOMING_ROUTES.map(r=>`<figure><img loading="lazy" decoding="async" width="1152" height="768" src="${HOMECOMING_SCENE_ART[r.id].src}" alt="${esc(HOMECOMING_SCENE_ART[r.id].alt)}"><figcaption><b>${esc(r.continent)}・${esc(r.title)}</b><small>${esc(r.companion)}／${esc(HOMECOMING_ADVENTURES[r.id].mechanic)}</small></figcaption></figure>`).join('');
document.querySelector('#opponents').innerHTML=Object.values(HOMECOMING_OPPONENTS).map(o=>`<figure><img loading="lazy" decoding="async" width="768" height="768" src="${o.artPath}" alt="${esc(o.name)}"><figcaption><b>${esc(o.name)}</b><small>${esc(o.description)}</small></figcaption></figure>`).join('');
</script></html>
