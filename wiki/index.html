<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>靈契紀元 WIKI｜冒險資料庫</title><meta name="wiki-ui-version" content="2026-11-02-gear-slots-v6"><style>
:root{color-scheme:dark;--bg:#0c111e;--panel:#172033;--line:#2c3b52;--text:#e9eef9;--muted:#afbdd1;--gold:#eac481;--accent:#6fb6ef}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(150deg,#0c111e,#15233b);color:var(--text);font:15px/1.65 system-ui,"Noto Sans TC",sans-serif;min-height:100vh}
header{padding:28px max(18px,calc((100vw - 1200px)/2));border-bottom:1px solid var(--line);background:#0c1426}header h1{font-size:28px;margin:0;color:var(--gold)}header p{margin:4px 0;color:var(--muted)}
main{max-width:1200px;margin:auto;padding:22px 18px 80px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
button,input,select{font:inherit;border:1px solid var(--line);border-radius:10px;color:var(--text);background:#17243a;padding:10px 13px}
button{cursor:pointer}button[aria-selected=true]{background:#355677;border-color:#76b8f3}input{flex:1;min-width:220px}
section[hidden]{display:none}.stats{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 22px}.pill{background:#20324b;border:1px solid var(--line);border-radius:999px;padding:5px 13px;color:#cdddff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:14px}.item{padding:18px;border:1px solid var(--line);background:var(--panel);border-radius:14px}
.item h3{margin:0 0 7px;color:#f1d5a5;font-size:17px}.item p{margin:4px 0}.small{font-size:13px;color:var(--muted)}
.tags{display:flex;gap:5px;flex-wrap:wrap}.tag{padding:2px 7px;border-radius:6px;background:#253953;color:#c6ddf7;font-size:12px}
table{width:100%;border-collapse:collapse;background:var(--panel);border-radius:12px;overflow:hidden}td,th{text-align:left;padding:11px;border-bottom:1px solid var(--line)}th{color:var(--gold)}.scroll{overflow:auto}
article{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:21px;margin:0 0 15px}article h3{color:var(--gold);margin-top:0}
code{color:#a6dcff}a{color:var(--accent)}.empty{color:var(--muted);padding:28px}.intro{color:var(--muted);margin-bottom:16px}
@media(max-width:600px){header h1{font-size:23px}.toolbar button{flex:1}.item{padding:14px}}
</style></head><body>
<header><h1>✦ 靈契紀元 WIKI</h1><p>怪物圖鑑 · 卡片資料 · 裝備能力範圍 · 夥伴與戰鬥機制</p><p class="small">WIKI 中文顯示版 2026.11.02.6</p></header>
<main><div class="toolbar" id="nav"><button data-tab="monsters" aria-selected="true">怪物</button><button data-tab="cards">卡片</button><button data-tab="gear">裝備詞條</button><button data-tab="pet">夥伴</button><button data-tab="rules">遊戲機制</button></div>
<div class="toolbar" id="filters"><input id="search" type="search" placeholder="搜尋名稱、等級、屬性或地圖"><select id="continent" aria-label="選擇大陸"><option value="">所有大陸</option><option value="icarus">伊卡洛斯大陸（Lv.1–99）</option><option value="sky">蒼穹彼岸（Lv.101–200）</option><option value="dawn">曙界新陸（Lv.201–210）</option></select><select id="zone" aria-label="選擇地圖"><option value="">所有地圖</option></select><select id="cardSlot" hidden aria-label="卡片裝備部位"><option value="">全部卡片部位</option></select><select id="rarity" hidden><option value="common">普通</option><option value="rare">稀有</option><option value="uncommon">罕見</option><option value="legendary">傳說</option><option value="mythic">神話</option></select><select id="tier" hidden></select></div>
<div id="cardLevelPanel" hidden class="item" style="margin:0 0 16px">
<p><b>卡片能力會隨人物等級變化</b></p>
<p class="small">固定數值會依人物等級所屬的裝備階級成長；百分比效果不受等級影響。下方卡片顯示換算後的能力。</p>
<label for="cardLevel">設定人物等級：</label> <input id="cardLevel" type="number" min="1" max="210" step="1" value="200" inputmode="numeric" style="flex:none;width:110px;min-width:0" aria-label="人物等級">
<span id="cardTierInfo" class="small"></span>
</div><div id="summary" class="stats"></div><div id="result"></div>
<p class="small">資料來源：本儲存庫 dist/ 正式版模組；本 WIKI 僅讀取遊戲資料，不存取玩家存檔、不修改遊戲。裝備範圍為單一詞條理論範圍，不等於整件裝備最終面板；實際數字可能受強化、稀有度、夥伴倍率及四捨五入影響。</p>
</main><script type="module">
import {WORLD_MONSTERS,ZONES} from '../world-data.js';
import {MAP_BOSSES} from '../map-bosses.js';
import {DAWN_ZONE,DAWN_MONSTERS,DAWN_BOSS} from '../dawn-world.js';
import {TRIAL_ROUTES,createTrialBoss} from '../sky-trials.js';
import {monsterRuntimeStats} from '../combat-balance.js';
import {CARDS,ITEMS,SLOTS,PET_RARITIES,PET_EVOLUTIONS,SPECIES} from '../catalog.js';
import {GEAR_BASE,PET_GEAR_BASE,RARITIES,AFFIX_NAMES,affixRange,primaryAffix,SPECIAL_AFFIXES,TIER_NAMES,QUALITY_POWER,PET_SLOTS} from '../loot.js';
import {ENHANCEMENT_POWER} from '../sky-trials.js';
import {GEAR_TIERS} from '../progression.js';
import {cardEffectsFor} from '../card-effects.js';
import {FUSION_PAIRS} from '../pet-fusion.js';
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const trialMonsters=TRIAL_ROUTES.flatMap(route=>route.names.map((_,i)=>({...createTrialBoss(route,i,MAP_BOSSES[route.map]),map:'trial-'+route.level,trialName:route.name})));
const monsterZones=[...ZONES,DAWN_ZONE,...TRIAL_ROUTES.map(r=>({id:'trial-'+r.level,name:'天穹試煉之門・'+r.name,min:r.level,max:r.level+8}))];
const continentOf=map=>!map||map==='legacy'?null:map==='dawnrift'?'dawn':map.startsWith('trial-')?'sky':(ZONES.find(z=>z.id===map)?.min||0)>=101?'sky':ZONES.some(z=>z.id===map)?'icarus':null;
const zoneName=map=>monsterZones.find(z=>z.id===map)?.name||map;
let tab='monsters';const allMonsters=[...WORLD_MONSTERS,...Object.values(MAP_BOSSES),...DAWN_MONSTERS,DAWN_BOSS,...trialMonsters].sort((a,b)=>a.level-b.level||(a.boss?1:-1));
const tiers=GEAR_TIERS;const pct=new Set(['ignoreDef','critDmg','magicDamage','fleePct','defPct','hpPct','aspdPct','damageReduction','crit']);
const pill=(name,value)=>'<span class="pill">'+esc(name)+' '+esc(value)+'</span>';
const card=(title,content)=>'<div class="item"><h3>'+esc(title)+'</h3>'+content+'</div>';
const fmt=v=>typeof v==='number'&&Number.isFinite(v)?new Intl.NumberFormat('zh-TW',{maximumFractionDigits:2}).format(v):String(v??'');
const STAT_NAMES={STR:'力量',AGI:'敏捷',VIT:'體質',INT:'智力',DEX:'靈巧',LUK:'幸運',
 atk:'物理攻擊',matk:'魔法攻擊',def:'物理防禦',mdef:'魔法防禦',hp:'生命值',mp:'魔力值',sp:'魔力值',
 hit:'命中',flee:'迴避',aspd:'攻擊速度',crit:'暴擊率',critDmg:'暴擊傷害',
 atkPct:'物理攻擊加成',matkPct:'魔法攻擊加成',defPct:'物理防禦加成',mdefPct:'魔法防禦加成',
 hpPct:'生命值加成',mpPct:'魔力值加成',hitPct:'命中加成',fleePct:'迴避加成',aspdPct:'攻擊速度加成',
 ignoreDef:'無視防禦',magicDamage:'魔法傷害加成',damageReduction:'最終減傷',
 castReduction:'詠唱時間減少',spRegen:'魔力恢復',hpRegen:'生命恢復',
 HP:'生命值',SP:'魔力值',ATK:'物理攻擊',MATK:'魔法攻擊',DEF:'物理防禦',MDEF:'魔法防禦',EXP:'經驗值'};
const statName=key=>STAT_NAMES[key]||AFFIX_NAMES[key]?.replace(/^[A-Z]+ /,'').trim()||key;
const percentStat=key=>key.endsWith('Pct')||['crit','critDmg','ignoreDef','magicDamage','damageReduction'].includes(key);
const label=(obj)=>Object.entries(obj||{}).map(([k,v])=>'<span class="tag">'+esc(statName(k))+' '+esc((typeof v==='number'&&v>=0?'+':'')+fmt(v))+(percentStat(k)?'%':'')+'</span>').join(' ');
const cardEffectLabel=effects=>Object.entries(effects||{}).map(([key,value])=>'<span class="tag" title="'+esc(key)+'">'+esc(statName(key))+' '+(Number(value)>=0?'+':'')+esc(fmt(value))+(percentStat(key)?'%':'')+'</span>').join('');
const dropName=id=>ITEMS[id]?.name||'未收錄物品';
const matches=(s)=>s.toLowerCase().includes($('search').value.trim().toLowerCase());
const num=v=>fmt(Number(v||0));
const attributes=['STR','AGI','VIT','INT','DEX','LUK'];
function possibleAffixes(id,base,pet,rarity){const primary=primaryAffix(id),weapon=!!base.weaponType||(pet&&base.petSlot==='head'),core=pet?(base.petSlot==='head'?[primary,'hit','DEX']:base.petSlot==='body'?['hp','def','mdef']:['flee','hit','def']):weapon?[primary,'hit','DEX']:['def','mdef','flee'];const guaranteed=weapon?[primary,'hit']:[primary];const count=RARITIES.find(r=>r.id===rarity)?.count||2;const options=count>guaranteed.length?[...new Set([...core,...attributes])]:[];const special=rarity==='mythic'?(weapon?['aspdPct','crit','critDmg','ignoreDef']:['fleePct','damageReduction','hpPct']):[];return {guaranteed,options:[...new Set([...guaranteed,...options,...special])],special};}
function gearAffixRange(key,tier,rarity,pet){let [a,b]=affixRange(key,tier,rarity);if(pet&&!SPECIAL_AFFIXES.has(key)&&!['atk','matk'].includes(key)){a=Math.round(a*10/3);b=Math.round(b*10/3);}return fmt(a)+'～'+fmt(b)+(pct.has(key)?'%':'');}
function gearCard(id,base,pet,tier,rarity){const {guaranteed,options,special}=possibleAffixes(id,base,pet,rarity);const affix=(key)=>'<span class="tag">'+esc(statName(key))+' '+esc(gearAffixRange(key,tier,rarity,pet))+'</span>';return card(base.name,'<p class="small">'+esc(pet?PET_SLOTS[base.petSlot]:SLOTS[base.slot])+' · '+(base.weaponType?'武器':'裝備')+'</p><p class="small">固定詞條</p><div class="tags">'+guaranteed.map(affix).join('')+'</div><p class="small">其他可能詞條（依品質與隨機抽選）</p><div class="tags">'+options.filter(k=>!guaranteed.includes(k)&&!special.includes(k)).map(affix).join('')+'</div>'+(special.length?'<p class="small">神話專屬：隨機一項</p><div class="tags">'+special.map(affix).join('')+'</div>':'') );}
function updateZones(){const continent=$('continent').value,previous=$('zone').value;const zones=monsterZones.filter(z=>!continent||continentOf(z.id)===continent);$('zone').replaceChildren(new Option('所有地圖',''));for(const z of zones){const e=new Option(z.name+' Lv.'+z.min+'–'+z.max,z.id);$('zone').append(e)}$('zone').value=zones.some(z=>z.id===previous)?previous:'';}
function setup(){updateZones();
Object.entries(SLOTS).forEach(([id,name])=>{const e=document.createElement('option');e.value=id;e.textContent=name;$('cardSlot').append(e)});
tiers.forEach((t,i)=>{const e=document.createElement('option');e.value=i+1;e.textContent=(i+1)+'階 '+t.name+' Lv.'+t.min+'–'+t.max;$('tier').append(e);});
$('tier').value='11';$('cardLevel').value='200';document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.setAttribute('aria-selected',x===b?'true':'false'));$('search').value='';render()});
['search','zone','cardSlot','tier','rarity'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));$('continent').addEventListener('change',()=>{updateZones();render()});$('cardLevel').addEventListener('input',()=>{if($('cardLevel').value!==''&&Number($('cardLevel').value)>=1&&Number($('cardLevel').value)<=210)render()});$('cardLevel').addEventListener('change',()=>{$('cardLevel').value=Math.min(210,Math.max(1,Math.floor(Number($('cardLevel').value)||200)));render()});render()}
function render(){const gear=tab==='gear',map=['monsters','cards'].includes(tab);$('continent').hidden=!map;$('zone').hidden=!map;$('cardSlot').hidden=tab!=='cards';$('cardLevelPanel').hidden=tab!=='cards';$('rarity').hidden=!gear;$('tier').hidden=!gear;
const level=Math.min(210,Math.max(1,Math.floor(Number($('cardLevel').value)||200)));const currentTier=tiers.find(t=>level<=t.max)||tiers[tiers.length-1];$('cardTierInfo').textContent='目前：'+currentTier.name+'階（固定能力倍率 ×'+fmt(currentTier.power)+'）';
const zone=$('zone').value,continent=$('continent').value,q=$('search').value.trim().toLowerCase();let html='',count=0;
if(tab==='monsters'){const rows=allMonsters.filter(m=>(!continent||continentOf(m.map)===continent)&&(!zone||m.map===zone)&&matches(m.name+' '+fmt(m.level)+' '+zoneName(m.map)));count=rows.length;html='<div class="grid">'+rows.map(m=>{const stats=monsterRuntimeStats(m);return card((m.boss?'👑 ':'')+m.name,'<p class="small">'+esc(zoneName(m.map))+' · Lv.'+m.level+' · '+(m.trial?'試煉首領':m.boss?'地圖首領':m.elite?'區域精英':'一般怪物')+'</p><div class="tags">'+label({HP:m.hp,ATK:m.atk,MATK:stats.matk,DEF:m.def,MDEF:stats.mdef,hit:stats.hit,flee:stats.flee,EXP:m.xp,金幣:m.gold})+'</div><p class="small">掉落：'+esc(m.trial?'試煉結晶依關卡機率獲得':m.dawn?'曙界專屬雜物':(m.drops||[]).map(dropName).join('、')||'參見遊戲掉落規則')+'</p>');}).join('')+'</div>';}
else if(tab==='cards'){const slot=$('cardSlot').value;const rows=Object.entries(CARDS).filter(([id,c])=>(!continent||continentOf(c.map)===continent)&&(!zone||c.map===zone)&&(!slot||(c.slots||[]).includes(slot))&&matches(c.name+' '+(c.theme||'')+' '+(c.description||'')+' '+Object.keys(c.effects||{}).map(statName).join(' ')));count=rows.length;html='<div class="grid">'+rows.map(([id,c])=>card(c.name,'<p class="small">'+esc(c.theme||'舊版靈契')+(c.boss?' · 首領卡':'')+'</p><p>部位：'+esc((c.slots||[]).map(s=>SLOTS[s]||s).join('／')||'未指定')+'</p><div class="tags">'+cardEffectLabel(cardEffectsFor(c,level))+'</div><p class="small">依 Lv.'+fmt(level)+' 的實際效果</p>')).join('')+'</div>';}
else if(gear){const rarity=$('rarity').value,tier=Number($('tier').value),all=[...Object.entries(GEAR_BASE).map(([id,g])=>[id,g,false]),...Object.entries(PET_GEAR_BASE).map(([id,g])=>[id,g,true])];const rows=all.filter(([id,g,p])=>{const keys=possibleAffixes(id,g,p,rarity).options;return !q||matches(g.name+' '+id+' '+(p?PET_SLOTS[g.petSlot]:SLOTS[g.slot])+' '+keys.map(k=>k+' '+statName(k)).join(' '));});count=rows.length;
html='<article><h3>依裝備部位查看可出現詞條</h3><p>階級：'+esc(tiers[tier-1].name)+' · '+esc(RARITIES.find(r=>r.id===rarity).name)+' · 品質係數 ×'+fmt(QUALITY_POWER[rarity])+'</p><p class="small">固定詞條必定出現；其他詞條為可能抽中，不代表同件裝備能全部擁有。神話品質另有一條專屬詞條。下列數值為單條隨機範圍，夥伴裝備已套用實際生成倍率。</p></article>';
for(const [pet,title,slots] of [[false,'人物裝備',Object.entries(SLOTS)],[true,'夥伴裝備',Object.entries(PET_SLOTS)]]){const section=rows.filter(r=>r[2]===pet);if(!section.length)continue;html+='<h2>'+title+'</h2>';for(const [slot,name] of slots){const items=section.filter(([,g])=>(pet?g.petSlot:g.slot)===slot);if(!items.length)continue;html+='<h3>'+esc(name)+'</h3><div class="grid">'+items.map(([id,g])=>gearCard(id,g,pet,tier,rarity)).join('')+'</div>';}}}
else if(tab==='pet'){const roles={'attack':'攻擊','magic':'魔法','defense':'防禦','support':'輔助'};const pairs=Object.entries(FUSION_PAIRS).filter(([id,p])=>matches(id+' '+p.name));count=pairs.length;html='<article><h3>夥伴稀有度</h3><div class="tags">'+PET_RARITIES.map(r=>'<span class="tag">'+r.name+' · 基礎倍率 ×'+fmt(r.factor)+'</span>').join('')+'</div></article><article><h3>一般進化</h3>'+PET_EVOLUTIONS.map(x=>'<p>Lv.'+fmt(x.level)+'：'+esc(dropName(x.id))+' ×'+fmt(x.count)+' · 素材區域 '+esc(x.range)+'</p>').join('')+'</article><article><h3>攻擊能力轉換</h3><p>融合攻擊型可將裝備提供的魔法攻擊／智力部分轉入物理攻擊；融合魔法型、輔助型可將裝備物理攻擊／力量部分轉入魔法攻擊。物理防禦與魔法防禦沒有此互轉規則；體質增加物理防禦，智力增加魔法防禦。</p></article><h2>融合夥伴</h2><div class="grid">'+pairs.map(([id,p])=>card(p.name,'<p>'+esc(id.split('-').map(x=>roles[x]||x).join(' × '))+'</p><p class="small">主要定位：'+esc(roles[p.role]||p.role)+'</p>')).join('')+'</div>';}
else {count=7;html='<article><h3>裝備階級與品質</h3><p>11 個裝備階級對應 Lv.1–200；品質為普通／稀有／罕見／傳說／神話，分別有 2／3／4／5／6 條詞綴。裝備實際效果依階級、品質、詞條及強化而定。</p><p>強化順序：D → C → B → A → S → SS → SSS。強化階乘：'+Object.entries(ENHANCEMENT_POWER).map(([k,v])=>k+' ×'+fmt(v)).join('、')+'</p></article>'+
'<article><h3>怪物與首領</h3><p>各區間一般怪物、區域精英與地圖首領分開列出。怪物數值直接採遊戲模組生成結果。實際戰鬥可能另有難度、技能與特殊機制修正。</p></article>'+
'<article><h3>卡片與插槽</h3><p>卡片依指定部位鑲嵌，怪物名稱與卡片效果來自遊戲資料庫。部分卡片的固定數值隨裝備階級成長；主角能力值有正常收益上限，超額走溢出潛能規則。</p></article>'+
'<article><h3>夥伴裝備數值</h3><p>夥伴裝備：頭部、身體、鞋三部位。物理攻擊可受力量詞條影響，魔法攻擊可受智力影響，物理防禦受體質影響，魔法防禦受智力影響。融合攻擊／魔法／輔助型存在不同攻擊能力轉換；裝備比較顯示的是最終面板差異，並非只列出裝備的直接詞條。</p></article>'+
'<article><h3>離線戰鬥與存檔</h3><p>離線掛機最多補算 24 小時；具體收益、停止條件、自動復活及首領避戰依正式遊戲運作。WIKI 本身不會讀取或修改玩家存檔。</p></article>'+
'<article><h3>進化、共鳴與試煉</h3><p>夥伴進化、融合及人物共鳴是獨立系統；試煉與強化材料依遊戲不同階段解鎖。以正式版程式為唯一規則來源，避免將測試數據寫成固定保證。</p></article>'+
'<article><h3>更新方式</h3><p>本站引用同一版本遊戲程式模組，重新部署時跟隨該版本資料；WIKI 與遊戲 UI、角色存檔互不影響。</p></article>';}
$('summary').innerHTML=pill('目前分類',({'monsters':'怪物圖鑑','cards':'卡片資料','gear':'裝備詞條','pet':'夥伴資料','rules':'機制說明'})[tab])+pill('顯示筆數',count)+pill('資料', 'GitHub 正式版');
$('result').innerHTML=html||'<p class="empty">沒有符合條件的資料。</p>';}
setup();
</script></body></html>
